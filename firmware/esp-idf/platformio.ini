; Dipper timing-leakage test, ESP-IDF via PlatformIO.
;   ../../.venv/bin/pio run -e nodemcu32s -t upload --upload-port /dev/cu.usbserial-XXXX
; Envs: nodemcu32s (own board, Wi-Fi off), nodemcu32s_wifi (Wi-Fi scan load),
;       nodemcu32s_s2 (repeat run, new seed), esp32c6 / lopy4 (IoT-LAB, merged .bin).
[platformio]
src_dir = main

[env]
platform = espressif32@7.1.3
framework = espidf
monitor_speed = 115200
build_flags = -DCFG_SEED=1

[env:nodemcu32s]
board = nodemcu-32s

[env:nodemcu32s_s2]
board = nodemcu-32s
build_flags = -DCFG_SEED=2

[env:nodemcu32s_wifi]
board = nodemcu-32s
build_flags = -DCFG_SEED=3 -DWIFI_LOAD=1

[env:esp32c6]
board = esp32-c6-devkitc-1

[env:esp32c6_s2]
board = esp32-c6-devkitc-1
build_flags = -DCFG_SEED=2

[env:lopy4]
board = lopy4

[env:lopy4_s2]
board = lopy4
build_flags = -DCFG_SEED=2

[env:nodemcu32s_wifi_s2]
board = nodemcu-32s
build_flags = -DCFG_SEED=4 -DWIFI_LOAD=1
